# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  # each new commit to a PR runs this workflow
  # so we need to avoid a long running older one from overwriting the "pr-<number>-latest"
  group: "${{ github.workflow }} @ ${{ github.ref_name }}"
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_FUND: "false"

jobs:
  warm-up-cache:
    name: Warm up the cache
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release/') }}
    permissions:
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          show-progress: false

      - name: Debug git state
        run: |
          git status --porcelain
          git diff -- pnpm-lock.yaml | sed -n '1,80p'

      - &install_pnpm
        name: Install pnpm
        uses: pnpm/action-setup@08c4be7e2e672a47d11bd04269e27e5f3e8529cb

      - name: Debug git state
        run: |
          git status --porcelain
          git diff -- pnpm-lock.yaml | sed -n '1,80p'

      - name: Show pnpm-lock.yaml before setup-node
        run: cat pnpm-lock.yaml


      - &install_node
        name: Set up node
        uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Show pnpm-lock.yaml after setup-node
        run: cat pnpm-lock.yaml

      
      - name: Debug git state
        run: |
          git status --porcelain
          git diff -- pnpm-lock.yaml | sed -n '1,80p'
          
      - run: pnpm install
      
      - name: Debug git state
        run: |
          git status --porcelain
          git diff -- pnpm-lock.yaml | sed -n '1,80p'