name: Repro setup-python OS-incompatible cache reuse

on:
  workflow_dispatch:

jobs:
  ubuntu-20-first:
    runs-on: self-hosted
    container:
      image: ubuntu:20.04
    steps:
      - name: Install tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bash curl ca-certificates git jq tar xz-utils file
      - name: Fix pip cache permissions
        run: |
            mkdir -p /github/home/.cache/pip
            chown -R "$(whoami)" /github/home/.cache

          
      - name: Setup Python
        uses: gowridurgad/setup-python@fix-1087-os-isolated-toolcache
        with:
          python-version: '3.8'

      - name: Inspect Python
        run: |
          echo "pythonLocation=$pythonLocation"
          which python || true
          python --version || true
          python -m pip --version || true
          python -c "import sys; print(sys.executable)" || true
          python -c "import ssl; print(ssl.OPENSSL_VERSION)" || true
          ldd "$(which python)" || true
      - name: Warm cache
        run: python -m pip install --upgrade pip --root-user-action=ignore

  
