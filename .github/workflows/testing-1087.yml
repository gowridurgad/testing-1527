name: Repro setup-python OS-incompatible cache reuse

on:
  workflow_dispatch:

jobs:
  ubuntu-20-first:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04
    steps:
      

      - name: Setup Python
        uses: actions/setup-python@v6 
        # uses: gowridurgad/setup-python@root-1027
        
        with:
          python-version: '3.8'

      - name: Inspect Python
        run: |
          echo "pythonLocation=$pythonLocation"
          which python || true
          python --version || true
          python -m pip --version || true
          python -c "import sys; print(sys.executable)" || true
          python -c "import ssl; print(ssl.OPENSSL_VERSION)" || true
          ldd "$(which python)" || true
      - name: Warm cache
        run: python -m pip install --upgrade pip

  ubuntu-24-second:
    needs: ubuntu-20-first
    runs-on: ubuntu-latest
    container:
      image: ubuntu:24.04
    steps:
  
      
      - name: Setup Python
        uses: actions/setup-python@v6
        # uses: gowridurgad/setup-python@root-1027
        with:
          python-version: '3.8'

      - name: Inspect Python
        run: |
          echo "pythonLocation=$pythonLocation"
          which python || true
          python --version || true
          python -m pip --version || true
          python -c "import sys; print(sys.executable)" || true
          python -c "import ssl; print(ssl.OPENSSL_VERSION)" || true
          ldd "$(which python)" || true
      - name: Trigger bug
        run: python -m pip install --upgrade pip
